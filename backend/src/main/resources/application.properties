spring.application.name=agendamento

# Banco de dados (PostgreSQL) - variaveis de ambiente com default para rodar local sem Docker
# DB_SSLMODE=require e necessario para provedores gerenciados como o Neon (default "disable" mantem
# compatibilidade com Postgres local via Docker, que normalmente nao expoe SSL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agendamento_db}?sslmode=${DB_SSLMODE:disable}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT - em producao, defina JWT_SECRET como variavel de ambiente (nao versione a chave real)
app.jwt.secret=${JWT_SECRET:troque-esta-chave-por-uma-bem-maior-e-secreta-em-producao-0123456789}
app.jwt.expiration-ms=86400000

server.port=8080

# origens de CORS permitidas (separadas por virgula); Render define CORS_ALLOWED_ORIGINS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
